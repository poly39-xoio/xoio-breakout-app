  body{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  /* 2026-10-09 John:iPad/橫向改為「縮小成直欄、左右留白」→ 舞台寬度上限 = 高度 * 0.56;窄螢幕(手機直立)仍填滿 */
  .wrap{position:relative;width:100vw;height:calc(100vh - 46px);height:calc(100dvh - 46px);margin:0 auto;display:flex;flex-direction:column}
  /* 2026-10-10 John:只有 iPad/橫向 才縮成直欄(0.56);手機直立改回「填滿」(修「畫面變超小」);並加 vh fallback(舊 WebView 無 dvh) */

/* ============================================================

LEVELS=LEVELS.map(l=>({name:l[0], nameEn:l[0].replace('經典','Classic ').replace('巨臉','Big Face'), rows:l[1]})); // 30 關、保留巨臉當最後一關 (2026-10-08 John)

/* ---------- 音效 ---------- */
let AC=null;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } return AC; }
function tone(f1,f2,dur,type,vol){ const a=actx(); if(!a)return; const o=a.createOscillator(),g=a.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f1,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.05,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur); }
function noise(dur,vol,lp){ const a=actx(); if(!a)return; const n=a.sampleRate*dur|0,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=buf; const g=a.createGain(); g.gain.value=vol||0.12;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900; s.connect(f); f.connect(g); g.connect(a.destination); s.start(); }
const SFX={ paddle:()=>tone(300,180,0.06,'square',0.05), hit:()=>tone(520,520,0.04,'triangle',0.04),
  brk:(r)=>tone(600+r*30,300,0.07,'square',0.05), explode:()=>{ noise(0.35,0.22,700); tone(160,60,0.3,'sawtooth',0.08); },
  power:()=>tone(500,900,0.14,'triangle',0.06), clear:()=>[0,0.09,0.18,0.28].forEach((t,i)=>setTimeout(()=>tone(520+i*160,0,0.18,'triangle',0.05),t*1000)),

function applyLang(){ const t=T(); const a=document.getElementById('lblRound'); if(a)a.textContent=t.round; const b=document.getElementById('lblScore'); if(b)b.textContent=t.score; const hb=document.getElementById('btnLobby'); if(hb)hb.textContent=t.lobby; const lg=document.getElementById('btnLang2'); if(lg)lg.textContent=(LANG==='en')?'中文':'EN'; const hn=document.getElementById('hName'); if(hn)hn.textContent=lvName(G.level); }
function setLang(l){ LANG=(l==='en')?'en':'zh'; try{ localStorage.setItem('brick_lang',LANG); }catch(e){} applyLang(); if(G&&G.mode==='menu') showOverlay('menu', true); }
const MAXBALLS=10;

function roundSpeed(i){ const n=LEVELS.length, f=Math.sqrt((W/420)*(H/760)); let v; if(SPEED_MODE==='hell') v=800+(n>1?i*200/(n-1):0); else if(SPEED_MODE==='advanced') v=500+(n>1?i*200/(n-1):0); else if(SPEED_MODE==='slow') v=150+(n>1?i*50/(n-1):0); else v=250+(n>1?i*150/(n-1):0); return v*f; }
const PADDLE_BY_MODE={slow:120, normal:110, advanced:95, hell:80}; // 底板寬度依難度固定 (2026-10-08 John)
function roundPaddle(i){ return Math.round((PADDLE_BY_MODE[SPEED_MODE]||100)*(W/420)); }

function buildLevel(i){
  const L=LEVELS[i];
  G.speed=roundSpeed(i); G.paddle.baseW=roundPaddle(i); G.paddle.w=G.paddle.baseW;
  G.paddle.widenT=0; G.paddle.laserT=0; G.paddle.squash=0;
  const SX=1, SY=1; // 每格 1 顆 (大磚 2026-10-08 John: 方案1)
  const cols0=Math.max(...L.rows.map(r=>r.length));
  const rows0=L.rows.map(r=>r.padEnd(cols0,'.'));
  const margin=Math.round(W*0.024), top=Math.round(H*0.121), gap=Math.max(1,Math.round(W*0.0024)), bh=Math.max(8,Math.min(Math.round(W*0.0405),Math.round(H*0.05)));
  G.paddle.h=Math.max(7,Math.round(bh*0.76)); G.paddle.y=H-Math.max(36,Math.round(H*0.0737)); G.paddle.x=W/2;
  const bw=(W-margin*2-gap*(cols0-1))/cols0;
  const cw=(bw-1*(SX-1))/SX, chh=(bh-1*(SY-1))/SY; // 子磚尺寸(格內 1px 縫)
  G.geom={margin,top,gap,bw,bh,cols:cols0,minBrick:Math.min(cw,chh)};
  G.bricks=[];
  rows0.forEach((row,r)=>{ for(let c=0;c<cols0;c++){
    const ch=row[c]; if(ch==='.') continue;
    const pal=PAL[r%6];
    let type='norm', hp=1, col=pal.c, pts=pal.p;
    if(ch==='X'){ type='hard'; col=GOLD; pts=0; }
    else if(ch==='V'){ type='silver'; hp=3; col=SILVER; pts=50*(i+1); }
    const cx0=margin+c*(bw+gap), cy0=top+r*(bh+gap);
    for(let sx=0;sx<SX;sx++) for(let sy=0;sy<SY;sy++){
      const X=cx0+sx*(cw+1), Y=cy0+sy*(chh+1);
      G.bricks.push({ x:X, bx:X, y:Y, w:cw, h:chh, row:r, type, hp, maxhp:hp, col, pts, alive:true, pop:0 });
    }
  }});
  G.movers=[]; G.portals=[]; G.bullets=[]; G.powerups=[]; G.particles=[]; G.texts=[]; G.waves=[]; G.combo=0;
  /* 每關固定各 1 個 M 與 L (2026-10-08 John): 隨機挑 2 塊可破磚 */
  { const _pw=G.bricks.filter(b=>b.type!=='hard'); if(_pw.length){ const _i=Math.floor(Math.random()*_pw.length); _pw[_i].power='M'; if(_pw.length>1){ let _j=Math.floor(Math.random()*(_pw.length-1)); if(_j>=_i)_j++; _pw[_j].power='L'; } } }
  resetBall();
}
function cellCenter(c,r){ const g=G.geom; return { x:g.margin+c*(g.bw+g.gap)+g.bw/2, y:g.top+r*(g.bh+g.gap)+g.bh/2 }; }
function resetBall(){ const _r=Math.max(4,Math.round((G.geom&&G.geom.bh?G.geom.bh:17)*0.47)); G.balls=[{x:G.paddle.x,y:G.paddle.y-_r-8,r:_r,vx:0,vy:0,stuck:true,trail:[]}]; G.bullets=[]; G.mode='ready'; }
function launch(){ const b=G.balls.find(x=>x.stuck); if(!b)return; actx();
  const a=(-90+(Math.random()*60-30))*Math.PI/180, sp=G.speed;
  b.vx=Math.cos(a)*sp*(Math.random()<0.5?-1:1); b.vy=-Math.abs(Math.sin(a)*sp);
  if(Math.abs(b.vy)<sp*0.5) b.vy=-sp*0.62; b.stuck=false; G.mode='play'; }
function spawnBalls(from,n){ for(let i=0;i<n&&G.balls.length<MAXBALLS;i++){ const ang=Math.atan2(from.vy,from.vx)+((i%2?1:-1)*0.38), sp=Math.min(Math.hypot(from.vx,from.vy)||G.speed,G.speed*1.5)||G.speed;
  G.balls.push({x:from.x,y:from.y,r:from.r,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,stuck:false,trail:[]}); } }

function pointerX(e){ const r=cv.getBoundingClientRect(); return Math.max(G.paddle.w/2,Math.min(W-G.paddle.w/2,(e.clientX-r.left)/r.width*W)); }
cv.addEventListener('pointermove',e=>{ if(G.mode==='play'||G.mode==='ready'){ G.paddle.x=pointerX(e); G.balls.forEach(b=>{ if(b.stuck)b.x=G.paddle.x; }); } });
cv.addEventListener('pointerdown',e=>{ if(G.mode==='ready') launch(); else { G.paddle.x=pointerX(e); G.balls.forEach(b=>{ if(b.stuck)b.x=G.paddle.x; }); } });

window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a')keys.left=true; if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key===' '){ e.preventDefault(); if(G.mode==='ready')launch(); } });

function update(dt){
  G.t+=dt;
  if(G.hitStop>0){ G.hitStop-=dt; dt*=0.18; }
  const kv=640;
  if(keys.left) G.paddle.x-=kv*dt; if(keys.right) G.paddle.x+=kv*dt;
  if(AUTO && G.mode==='play'){ let t=G.balls[0]; for(const b of G.balls) if(b.y>t.y) t=b; if(t) G.paddle.x+=Math.max(-760*dt,Math.min(760*dt,(t.x-G.paddle.x)*0.24)); }
  if(G.paddle.widenT>0){ G.paddle.widenT-=dt; G.paddle.w=G.paddle.baseW*1.55; } else G.paddle.w=G.paddle.baseW;
  G.paddle.x=Math.max(G.paddle.w/2,Math.min(W-G.paddle.w/2,G.paddle.x));
  if(G.paddle.squash>0) G.paddle.squash=Math.max(0,G.paddle.squash-dt*4);
  if(G.paddle.laserT>0){ G.paddle.laserT-=dt; G.paddle.fireCd-=dt; if(G.paddle.fireCd<=0){ G.paddle.fireCd=0.28; const y=G.paddle.y-6;
    G.bullets.push({x:G.paddle.x-G.paddle.w/2+6,y,vy:-560},{x:G.paddle.x+G.paddle.w/2-6,y,vy:-560}); SFX.hit(); } }
  if(G.mode==='ready'){ G.balls.forEach(b=>{ b.x=G.paddle.x; b.y=G.paddle.y-b.r-8; }); }
  if(G.mode==='play'){
    for(const b of G.balls){
      const sp=Math.hypot(b.vx,b.vy), _mb=(G.geom&&G.geom.minBrick)?G.geom.minBrick:6, steps=Math.min(64,Math.max(1,Math.ceil(sp*dt/Math.max(1.2,Math.min(b.r,_mb)*0.5)))); for(let s=0;s<steps;s++) moveBall(b,dt/steps); }
    for(const bl of G.bullets) bl.y+=bl.vy*dt;
    G.bullets=G.bullets.filter(bl=>{ if(bl.y<20)return false; for(const br of G.bricks){ if(!br.alive)continue;
      if(bl.x>br.x&&bl.x<br.x+br.w&&bl.y>br.y&&bl.y<br.y+br.h){ hitBrick(br,null); return false; } } return true; });
    G.balls=G.balls.filter(b=>b.y-b.r<=H);
    // 防卡改為 antiFlat 機制(見 moveBall): 不再有突發轉向 (2026-10-08 John)
    if(G.balls.length===0){ G.lives--; SFX.lose(); updateHud(); if(G.lives<=0){ G.mode='gameover'; showOverlay('gameover'); } else { G.shake=14; resetBall(); } }
  }
  for(const p of G.powerups) p.y+=120*dt;
  G.powerups=G.powerups.filter(p=>{ if(p.y>H+20)return false; const pd=G.paddle;
    if(p.y>pd.y-6&&p.y<pd.y+pd.h+8&&p.x>pd.x-pd.w/2-10&&p.x<pd.x+pd.w/2+10){ applyPower(p.type); return false; } return true; });
  for(const b of G.bricks) if(b.pop>0) b.pop=Math.max(0,b.pop-dt*6);
  for(const p of G.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=1000*dt; p.life-=dt; } G.particles=G.particles.filter(p=>p.life>0);
  for(const t of G.texts){ t.y+=t.vy*dt; t.vy+=40*dt; t.life-=dt; } G.texts=G.texts.filter(t=>t.life>0);
  for(const w of G.waves){ w.r+=(w.maxr-w.r)*Math.min(1,dt*7); w.life-=dt; } G.waves=G.waves.filter(w=>w.life>0);
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*60);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*3);
}
function antiFlat(b){ /* 夾住角度, 離水平至少約 14.5°, 防止平飛鎖死 */
  const sp=Math.hypot(b.vx,b.vy)||G.speed; const minY=0.25*sp;
  if(Math.abs(b.vy)<minY){ const sg=b.vy>0?1:(b.vy<0?-1:(Math.random()<0.5?-1:1)); b.vy=sg*minY; const vx=Math.sqrt(Math.max(0,sp*sp-b.vy*b.vy)); b.vx=(b.vx<0?-1:1)*vx; } }
function moveBall(b,dt){
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.x-b.r<0){ b.x=b.r; b.vx=Math.abs(b.vx); } if(b.x+b.r>W){ b.x=W-b.r; b.vx=-Math.abs(b.vx); } if(b.y-b.r<0){ b.y=b.r; b.vy=Math.abs(b.vy); }
  /* 2026-10-10 修卡死:球跑到磗場上方(頂牆與磗之間)且近乎垂直彈跳過久 → 打斜+往下,避免死循環 */
  if(G.geom && b.y < G.geom.top - b.r){ const _s0=Math.hypot(b.vx,b.vy)||G.speed;
    if(Math.abs(b.vx) < _s0*0.18){ b.topT=(b.topT||0)+dt; if(b.topT>1.4){ b.vx=(Math.random()<0.5?-1:1)*_s0*0.5; b.vy=Math.abs(b.vy)||_s0*0.5; b.topT=0; } }
    else b.topT=0;
  } else b.topT=0;
  antiFlat(b);
  const p=G.paddle;
  if(b.vy>0 && b.y+b.r>=p.y && b.y-b.r<=p.y+p.h && b.x>=p.x-p.w/2-b.r && b.x<=p.x+p.w/2+b.r){
    b.y=p.y-b.r; const rel=(b.x-p.x)/(p.w/2), ang=rel*(Math.PI/3); const sp=Math.min(Math.hypot(b.vx,b.vy)*1.01,G.speed*1.5);
    b.vx=Math.sin(ang)*sp; b.vy=-Math.cos(ang)*sp; SFX.paddle();
    for(let i=0;i<5;i++) G.particles.push({x:b.x,y:p.y,vx:(Math.random()*2-1)*90,vy:-Math.random()*90,life:0.25,col:'#ffd873'}); }
  for(const br of G.bricks){ if(!br.alive) continue;
    if(b.x+b.r<br.x||b.x-b.r>br.x+br.w||b.y+b.r<br.y||b.y-b.r>br.y+br.h) continue;
    const cx=Math.max(br.x,Math.min(b.x,br.x+br.w)), cy=Math.max(br.y,Math.min(b.y,br.y+br.h)); const dx=b.x-cx,dy=b.y-cy;
    if(dx*dx+dy*dy>b.r*b.r) continue;
    const ovX=(b.r+br.w/2)-Math.abs(b.x-(br.x+br.w/2)), ovY=(b.r+br.h/2)-Math.abs(b.y-(br.y+br.h/2));
    if(ovX<ovY){ b.vx=-b.vx; b.x+=(b.x<br.x+br.w/2?-1:1)*0.6; } else { b.vy=-b.vy; b.y+=(b.y<br.y+br.h/2?-1:1)*0.6; }
    hitBrick(br,b); break; }
}
function hitBrick(br,ball){ const bx=br.x+br.w/2, by=br.y+br.h/2;
  if(br.type==='hard'){ burst(bx,by,'#d9b04a',6); G.shake=5; SFX.hit(); return; }
  br.hp--; br.pop=1;
  if(br.hp>0){ burst(bx,by,'#cfe0ff',5); SFX.hit(); return; }
  br.alive=false; G.stall=0; G.combo++; G.comboT=1.5;
  const gain=Math.round(br.pts*Math.min(6,1+Math.floor(G.combo/4))); G.score+=gain;
  burst(bx,by,br.col,12); text(bx,by-6,'+'+gain,br.col);
  if(G.combo>=4) text(bx,by-24,'COMBO x'+G.combo,'#ffe45c');
  G.shake=Math.max(G.shake,5); SFX.brk(br.row);
  if(br.power){ G.powerups.push({x:bx,y:by,type:br.power}); } // 固定道具
}
function dropPower(x,y){ const r=Math.random(); const t=r<0.55?'M':'L'; G.powerups.push({x,y,type:t}); }
function applyPower(t){ if(t==='W') G.paddle.widenT=8; else if(t==='M'){ const b=G.balls[0]; if(b) spawnBalls(b,2); }
  else if(t==='L'){ G.paddle.laserT=8; G.paddle.fireCd=0; } else if(t==='S'){ for(const b of G.balls){ b.vx*=0.72; b.vy*=0.72; } }
  burst(G.paddle.x,G.paddle.y,'#ffd873',14); text(G.paddle.x,G.paddle.y-20,'POWER '+t,'#ffd873'); G.flash=0.25; SFX.power(); }
function burst(x,y,col,n=9){ for(let i=0;i<n;i++) G.particles.push({x,y,vx:(Math.random()*2-1)*260,vy:(Math.random()*2-1)*260-70,life:0.4+Math.random()*0.4,col}); }
function text(x,y,txt,col){ G.texts.push({x,y,txt,col,vy:-60,life:0.9}); }
function wave(x,y,maxr,col){ G.waves.push({x,y,r:6,maxr,col,life:0.5}); }

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function draw(){
  ctx.save(); if(G.shake>0) ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);
  ctx.fillStyle='#05070f'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='rgba(80,110,200,.05)'; ctx.lineWidth=1; for(let x=0;x<W;x+=35){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(const b of G.bricks){ if(!b.alive) continue; const cx=b.x+b.w/2, cy=b.y+b.h/2, sc=1+b.pop*0.18; const rr=Math.max(1.4,Math.min(6,b.h*0.3));
    ctx.save(); ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-cx,-cy);
    if(b.type==='hard'){ ctx.fillStyle=GOLD; roundRect(b.x,b.y,b.w,b.h,rr); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; roundRect(b.x+1,b.y+1,b.w-2,b.h-2,Math.max(1,rr-1)); ctx.stroke(); }
    else { ctx.save(); ctx.shadowColor=b.col; ctx.shadowBlur=b.pop>0?12:4; ctx.fillStyle=b.col; roundRect(b.x,b.y,b.w,b.h,6); ctx.fill(); ctx.restore();
      if(b.type==='silver'){ ctx.fillStyle='rgba(60,70,90,.85)'; ctx.font='bold 11px "Campton","Avenir Next","Montserrat","Inter","Huninn",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('◈',cx,cy+1); ctx.textBaseline='alphabetic'; }
      if(b.maxhp>1 && b.hp<b.maxhp && b.type!=='silver'){ ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(b.x+4,b.y+b.h-4); ctx.lineTo(b.x+b.w*0.4,b.y+5); ctx.lineTo(b.x+b.w*0.65,b.y+b.h-5); ctx.stroke(); } }
    ctx.restore(); }
  for(const p of G.powerups){ const col=p.type==='W'?'#5be0a0':p.type==='M'?'#ffd45c':p.type==='L'?'#ff6b9a':'#7fe3ff';
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col; roundRect(p.x-12,p.y-12,24,24,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='#08131f'; ctx.font='bold 13px "Campton","Avenir Next","Montserrat","Inter","Huninn",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.type,p.x,p.y+1); ctx.textBaseline='alphabetic'; }
  const pd=G.paddle, sy=1-pd.squash*0.35, sx=1+pd.squash*0.25, cx0=pd.x, cy0=pd.y+pd.h/2;
  ctx.save(); ctx.shadowColor='rgba(247,181,0,.9)'; ctx.shadowBlur=18; ctx.translate(cx0,cy0); ctx.scale(sx,sy); ctx.translate(-cx0,-cy0);
  const pg=ctx.createLinearGradient(pd.x-pd.w/2,0,pd.x+pd.w/2,0); pg.addColorStop(0,'#f7b500'); pg.addColorStop(.5,'#ffd873'); pg.addColorStop(1,'#f7b500');
  ctx.fillStyle=pg; roundRect(pd.x-pd.w/2,pd.y,pd.w,pd.h,7); ctx.fill(); ctx.restore();
  for(const bl of G.bullets){ ctx.save(); ctx.shadowColor='#ff5a5a'; ctx.shadowBlur=8; ctx.fillStyle='#ff3b30'; ctx.fillRect(bl.x-2,bl.y-8,4,12); ctx.restore(); }
  for(const b of G.balls){ ctx.save(); ctx.shadowColor='rgba(255,255,255,.95)'; ctx.shadowBlur=16; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.restore(); }
  for(const p of G.particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.fillRect(p.x-2,p.y-2,4,4); } ctx.globalAlpha=1;
  for(const w of G.waves){ ctx.globalAlpha=Math.max(0,w.life*1.6); ctx.strokeStyle=w.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,7); ctx.stroke(); } ctx.globalAlpha=1;
  for(const t of G.texts){ ctx.globalAlpha=Math.min(1,t.life*1.4); ctx.fillStyle=t.col; ctx.font='800 15px "Campton","Avenir Next","Montserrat","Inter","Huninn",sans-serif'; ctx.textAlign='center'; ctx.fillText(t.txt,t.x,t.y); } ctx.globalAlpha=1;
  if(G.combo>=4){ ctx.fillStyle='rgba(255,230,120,.95)'; ctx.font='800 22px "Campton","Avenir Next","Montserrat","Inter","Huninn",sans-serif'; ctx.textAlign='center'; ctx.fillText('COMBO x'+G.combo, W/2, 200); }
  if(G.mode==='ready'){ ctx.fillStyle='rgba(238,242,255,.92)'; ctx.font='600 15px "Campton","Avenir Next","Montserrat","Inter","Huninn",sans-serif'; ctx.textAlign='center'; ctx.fillText(T().tip, W/2, pd.y-46); }
  ctx.restore();
  if(G.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')'; ctx.fillRect(0,0,W,H); }
}
let last=performance.now();

};

function renderLobbyGrid(){
  const g=document.getElementById('lobbyGrid'); if(!g) return;
  const sb=document.getElementById('lobbyStart');
  if(!SPEED_PICKED){ g.style.display='none'; if(sb) sb.style.display='none'; return; }
  g.style.display=''; if(sb) sb.style.display='';
  const done=PROG.get(SPEED_MODE); g.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button'); b.textContent=(i+1);
    const cls=[]; if(done[i]) cls.push('done'); if(i===SEL_LEVEL) cls.push('sel'); b.className=cls.join(' ');
    b.onclick=function(){ SEL_LEVEL=i; renderLobbyGrid(); };
    g.appendChild(b);
  }
  if(sb){ if(SEL_LEVEL>=0) sb.classList.remove('dim'); else sb.classList.add('dim');
    sb.onclick=function(){ if(SEL_LEVEL>=0){ START_LEVEL=SEL_LEVEL; onStart(); } }; }
}
function _setCtrlBar(showLang){ const bar=document.querySelector('.ctrlbar-in'), lb=document.getElementById('btnLang2'); if(lb) lb.style.display=showLang?'':'none'; if(bar) bar.classList.toggle('center', !showLang); }
function showOverlay(kind, keepPick){
  ov.classList.remove('hide');
  if(kind==='menu' && !keepPick){ SPEED_PICKED=false; SEL_LEVEL=-1; }
  if(kind==='menu'){ const t=T(); ov.innerHTML=`<h1>${t.title}</h1><div class="menu-grid"><button class="cell sp ${SPEED_MODE==='slow'?'on':''}" data-sp="slow">${t.slow}</button><button class="cell sp ${SPEED_MODE==='normal'?'on':''}" data-sp="normal">${t.normal}</button><button class="cell sp ${SPEED_MODE==='advanced'?'on':''}" data-sp="advanced">${t.advanced}</button><button class="cell sp ${SPEED_MODE==='hell'?'on':''}" data-sp="hell">${t.hell}</button></div><div class="lobby-grid" id="lobbyGrid"></div><button class="btn dim" id="lobbyStart">${t.start}</button>
      `; }
  else if(kind==='levelclear'){ const t=T(); ov.innerHTML=`<h1>${t.clear(G.level+1)}</h1><p>${t.score} <b>${G.score}</b></p><button class="btn" id="startBtn">${t.next}</button>`; }
  else if(kind==='gameover'){ const t=T(); ov.innerHTML=`<h1>${t.go}</h1><p>${t.init(G.level+1)} · ${t.score} <b>${G.score}</b></p><div class="go-btns"><button class="btn" id="startBtn">${t.fromhead}</button><button class="btn" id="retryBtn">${t.fromlvl(G.level+1)}</button></div>`; }
  else if(kind==='win'){ const t=T(); ov.innerHTML=`<h1>${t.allclear}</h1><p>${t.done(LEVELS.length)} · ${t.score} <b>${G.score}</b></p><button class="btn" id="startBtn">${t.again}</button>`; }
  const b=document.getElementById('startBtn'); if(b) b.onclick=onStart;
  ov.querySelectorAll('.menu-grid .cell.sp').forEach(bt=>{ bt.onclick=()=>{ SPEED_MODE=bt.getAttribute('data-sp'); SPEED_PICKED=true; try{ localStorage.setItem('brick_speed',SPEED_MODE); }catch(e){} ov.querySelectorAll('.menu-grid .cell.sp').forEach(x=>x.classList.toggle('on',x===bt)); renderLobbyGrid(); }; });
  const rb=document.getElementById('retryBtn'); if(rb) rb.onclick=onRetry;
  const lb=document.getElementById('langBtn'); if(lb) lb.onclick=()=>{ setLang(LANG==='en'?'zh':'en'); };
  if(kind==='menu') renderLobbyGrid();
  _setCtrlBar(kind==='menu');
}
function hideOverlay(){ ov.classList.add('hide'); _setCtrlBar(false); }
function onStart(){ if(G.mode==='menu'||G.mode==='gameover'||G.mode==='win'){ G.level=START_LEVEL; G.score=0; G.lives=MAXLIVES; buildLevel(G.level); }
  else if(G.mode==='levelclear'){ G.level++; buildLevel(G.level); }
  hideOverlay(); updateHud(); G.mode='ready'; if(AUTO) launch(); }
function onRetry(){ G.lives=MAXLIVES; buildLevel(G.level); hideOverlay(); updateHud(); G.mode='ready'; if(AUTO) launch(); }
function checkClear(){ if(G.mode==='play' && G.bricks.every(b=>!b.alive||b.type==='hard')){ SFX.clear(); G.flash=0.4; try{ PROG.mark(SPEED_MODE,G.level); }catch(e){}
  if(G.level>=LEVELS.length-1){ G.mode='win'; showOverlay('win'); } else { G.mode='levelclear'; showOverlay('levelclear'); } } }
const _lb=document.getElementById('btnLobby'); if(_lb) _lb.onclick=function(){ G.mode='menu'; showOverlay('menu'); };
const _lb2=document.getElementById('btnLang2'); if(_lb2) _lb2.onclick=function(){ setLang(LANG==='en'?'zh':'en'); };
fit(); buildLevel(0); G.mode='menu'; updateHud(); applyLang(); checkRotate(); showOverlay('menu'); if(AUTO||_lvlQ>=1){ onStart(); } requestAnimationFrame(loop);
</script>
</body>
</html>
